name: NEVO calibration
on:
  push:
    branches: [calibration/ambience-nonlin]
    paths: ['tests/nevo_fit.py', '.github/workflows/nevo.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: pip install numpy scipy
      - run: python tests/nevo_fit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NEVO-calibration
          path: |
            calibration-results/
            src/Engine.hpp
